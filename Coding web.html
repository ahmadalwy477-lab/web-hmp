    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Latar belakang gradasi kuning krem yang elegan */
            background: linear-gradient(135deg, #FFFCF2 0%, #FFF3C7 50%, #FDE49C 100%);
        }

        /* Animasi untuk Logo Bergerak (Melayang) */
        @keyframes float {
            0% { transform: translateY(0px); box-shadow: 0 10px 25px rgba(234, 179, 8, 0.3); }
            50% { transform: translateY(-12px); box-shadow: 0 20px 30px rgba(234, 179, 8, 0.5); }
            100% { transform: translateY(0px); box-shadow: 0 10px 25px rgba(234, 179, 8, 0.3); }
        }

        .logo-animate {
            animation: float 3.5s ease-in-out infinite;
        }

        /* Animasi background hiasan (lingkaran blur) */
        @keyframes pulse-slow {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 0.5; }
        }

        .blob {
            position: fixed; /* Diubah menjadi fixed agar tetap di tempat saat di-scroll */
            filter: blur(60px);
            z-index: 0;
            animation: pulse-slow 8s infinite alternate;
            pointer-events: none; /* Agar tidak menghalangi klik pada elemen di bawahnya */
        }

        /* Glassmorphism Effect untuk Container */
        .glass-container {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        /* Tombol Link Kustom */
        .link-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid transparent;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        /* Efek Hover Tombol */
        .link-btn:hover {
            background: #FACC15; /* Kuning cerah */
            border-color: #EAB308; /* Border kuning gelap */
            color: #451A03; /* Teks cokelat gelap */
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 10px 20px rgba(234, 179, 8, 0.3);
        }

        .link-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: all 0.5s ease;
        }

        .link-btn:hover::before {
            left: 100%;
        }
    </style>
</head>
